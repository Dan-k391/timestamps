# Builds the macOS app (Apple silicon + Intel) and, for version tags,
# attaches it to the GitHub release.
name: macOS

on:
  push:
    branches: [main, macos]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Test
        run: go test ./...

      - name: Build Timestamps.app
        run: sh ./build-mac.sh

      - uses: actions/upload-artifact@v6
        with:
          name: Timestamps-macOS
          path: build/Timestamps-*-macos.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/Timestamps-*-macos.zip
